name: Pipeline MS Restaurantes

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilacion y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar pruebas (H2)
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Publicar JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ms-restaurantes-jar
          path: target/restaurante-*.jar
          if-no-files-found: error
