# ==============================================================
#  PLAZOLETA DE COMIDAS · Microservicio de Restaurantes
#  Puerto: 8081 · Base de datos: MySQL 8 (Docker)
#  Los valores sensibles NUNCA van aquí: llegan por entorno
# ==============================================================

spring.application.name=ms-restaurantes
server.port=8081

# ---------- Conexión a la base de datos ----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# update: Hibernate crea o ajusta las tablas según las entidades,
# SIN borrar los datos que ya existen (ideal en desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Descomenta para ver el SQL generado en consola:
# spring.jpa.show-sql=true

# ---------- Seguridad / Tokens JWT ----------
# Este microservicio NO emite tokens: solo valida la firma de los
# JWT que emite el microservicio de usuarios. El secreto debe ser
# EXACTAMENTE el mismo en los dos microservicios (mínimo 32 caracteres).
seguridad.jwt.secreto=${APP_JWT_SECRET}

# ---------- Integración con el microservicio de usuarios ----------
# Se consulta por Feign para confirmar roles de propietarios (HU2)
# y para crear las cuentas de los empleados (HU6).
integraciones.usuario.base-url=${USUARIO_API_URL:http://localhost:8080}

# ---------- Semilla de datos demo ----------
# Identificadores de las cuentas propietario que crea el microservicio
# de usuarios con la base vacía (Camila Ríos = 2 y Jorge Barajas = 3).
semilla.id-propietario-brasa=${SEMILLA_PROPIETARIO_BRASA:2}
semilla.id-propietario-wok=${SEMILLA_PROPIETARIO_WOK:3}
